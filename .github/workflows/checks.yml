# Runs every check of every parasha on each push (scripts/check_all.py --ci). A red X on a commit means a new hit
# that was not read and accepted, or a broken script; open the run to see which parasha and which check.
name: checks
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parasha: [bereshit, noach, lech_lecha, vayera, chayei_sarah, toledot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check_all ${{ matrix.parasha }}
        run: python3 -I scripts/check_all.py ${{ matrix.parasha }} --ci
  rulings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: rulings log current, no superseded model pointed to
        run: python3 -I scripts/rulings.py --check
